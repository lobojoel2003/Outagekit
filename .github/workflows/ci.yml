name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Check versions agree
        run: node scripts/check-version.mjs
      - name: Check the catalog docs are current
        run: node scripts/catalog-docs.mjs --check
      - name: Build runtime library
        run: pnpm --filter @outagekit/runtime build
      - name: Pack runtime library
        run: |
          mkdir -p release-artifacts
          cd packages/runtime && pnpm pack --pack-destination ../../release-artifacts
      - name: Build web app
        run: pnpm --filter @outagekit/web build
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Test coverage'
            echo
            echo '| Package | Lines | Branches | Functions |'
            echo '| --- | --- | --- | --- |'
            for pkg in packages/runtime apps/web; do
              f="$pkg/coverage/coverage-summary.json"
              [ -f "$f" ] && node -e "const t=require('./$f').total;console.log('| $pkg | '+t.lines.pct+'% | '+t.branches.pct+'% | '+t.functions.pct+'% |')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-package
          path: release-artifacts/*.tgz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            packages/runtime/coverage
            apps/web/coverage
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @outagekit/web exec playwright install --with-deps chromium
      - name: Build web app
        run: pnpm --filter @outagekit/web build
      - name: Run end-to-end tests
        run: pnpm --filter @outagekit/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync Capacitor
        run: pnpm --filter @outagekit/web cap:sync
      - name: Assemble debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          mkdir -p release-artifacts
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/outagekit-${version}-build${BUILD_NUMBER}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: release-artifacts/*.apk
          retention-days: 14
