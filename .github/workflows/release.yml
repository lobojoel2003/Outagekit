name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for, e.g. v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package versions
        id: version
        run: |
          node scripts/check-version.mjs "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web:
    name: Web app and library
    runs-on: ubuntu-latest
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build runtime library and pack it
        run: |
          mkdir -p release-artifacts
          pnpm --filter @outagekit/runtime build
          cd packages/runtime && pnpm pack --pack-destination ../../release-artifacts
      - name: Build self-hostable web app (works from any folder)
        run: |
          BASE_PATH=./ pnpm --filter @outagekit/web build
          cd apps/web/dist && zip -qr "../../../release-artifacts/outagekit-web-${VERSION}.zip" . -x '*.map'
      - name: Attach the open device catalog
        run: |
          cp packages/runtime/src/catalog/devices.json "release-artifacts/outagekit-devices-${VERSION}.json"
          cp packages/runtime/src/catalog/power-sources.json "release-artifacts/outagekit-power-sources-${VERSION}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release-artifacts/*

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build web assets and sync Capacitor
        run: pnpm --filter @outagekit/web cap:sync
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/outagekit-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/outagekit-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and App Bundle
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          mkdir -p ../../../release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "../../../release-artifacts/outagekit-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../../release-artifacts/outagekit-${VERSION}.aab"
      - name: Build debug APK (no signing key configured)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: apps/web/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../../release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "../../../release-artifacts/outagekit-${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-artifacts/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, web, android]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from the changelog
        run: |
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          {
            echo
            echo '### Downloads'
            echo
            echo '| File | What it is |'
            echo '| --- | --- |'
            for f in release-artifacts/*; do
              name=$(basename "$f")
              case "$name" in
                *-debug.apk) what='Android app (debug-signed test build; install by allowing apps from this source)';;
                *.apk) what='Android app (signed)';;
                *.aab) what='Android App Bundle for Google Play';;
                outagekit-web-*.zip) what='Offline web app, ready to host from any folder';;
                outagekit-runtime-*.tgz) what='`@outagekit/runtime` library (MIT), install with `npm install ./file.tgz`';;
                outagekit-devices-*.json) what='Open device power catalog (MIT)';;
                outagekit-power-sources-*.json) what='Open power station catalog (MIT)';;
                SHA256SUMS.txt) what='SHA-256 checksums';;
                *) what='';;
              esac
              echo "| \`$name\` | $what |"
            done
            echo
            echo "Build ${BUILD_NUMBER} · commit ${GITHUB_SHA::7}"
          } >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Outagekit ${{ env.TAG }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: release-artifacts/*
          fail_on_unmatched_files: true

  npm:
    name: Publish library to npm
    runs-on: ubuntu-latest
    needs: [verify, publish]
    if: needs.verify.outputs.prerelease == 'false'
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip when no npm token is configured
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN secret not set; skipping npm publish."
      - uses: actions/checkout@v5
        if: env.NODE_AUTH_TOKEN != ''
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: env.NODE_AUTH_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - if: env.NODE_AUTH_TOKEN != ''
        working-directory: packages/runtime
        run: pnpm publish --access public --provenance --no-git-checks
